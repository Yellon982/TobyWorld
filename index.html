<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>TOBYWORLD Core Interface</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui-container">
        <!-- Minimalist cinematic mode: HUD panels removed -->
        <div class="search-container">
            <input type="text" id="deed-search-input" placeholder="DEED # (1-2869)">
            <button id="deed-search-btn" class="cyber-button">SEARCH</button>
        </div>
        <div class="search-instruction">
            Click on floating LoreLand to see random Deed Stats
        </div>
        <a href="https://tobyworld.app/" class="home-link" title="Visit TobyWorld.app">
            <img src="public/OGToby.png" alt="OG Toby">
        </a>
    </div>

    <!-- TERMINAL MODAL -->
    <div id="wallet-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-btn">&times;</button>
            <h2 style="text-align: center;">TERMINAL ACCESS</h2>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <button id="connect-wallet-btn" class="cyber-button" style="width: 100%;">CONNECT WALLET</button>
                <p style="font-size: 0.75rem; color: #888; margin-top: 10px; font-family: monospace;">
                    <span style="color: #00ffff;">&#x1F512; SECURE CONNECTION:</span> This action is 100% Read-Only. No signatures required. Your assets and data are completely safe.
                </p>
            </div>
            
            <div id="wallet-info" style="display: none;">
                <p style="text-align: center; font-size: 0.9rem; color: #888; margin-bottom: 5px;">ID: <span id="wallet-address" style="color: #00ff88;">0x...</span></p>
                <p style="text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 20px;">NETWORK: <span id="network-status">BASE</span></p>
                
                <div class="asset-grid">
                    <!-- Lore Lands -->
                    <div class="asset-card">
                        <div class="asset-icon" style="background: linear-gradient(135deg, #00ffff, #0033ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">🌍</div>
                        <div class="asset-info">
                            <span class="asset-title">Lore Lands</span>
                            <span class="asset-subtitle">DEEDS</span>
                        </div>
                        <div class="asset-balance" id="bal-lorelands">...</div>
                    </div>

                    <!-- Tokens -->
                    <div class="asset-card">
                        <img src="https://tobyworld.app/uploads/pasted-1785880946617-0.png" alt="Taboshi" class="asset-icon">
                        <div class="asset-info">
                            <span class="asset-title">taboshi</span>
                            <span class="asset-subtitle">$TABOSHI</span>
                        </div>
                        <div class="asset-balance" id="bal-taboshi">...</div>
                    </div>
                    
                    <div class="asset-card">
                        <img src="https://tobyworld.app/uploads/pasted-1785880901018-0.png" alt="Patience" class="asset-icon">
                        <div class="asset-info">
                            <span class="asset-title">patience</span>
                            <span class="asset-subtitle">$PATIENCE</span>
                        </div>
                        <div class="asset-balance" id="bal-patience">...</div>
                    </div>

                    <div class="asset-card">
                        <img src="https://tobyworld.app/uploads/logo.png" alt="Toby" class="asset-icon">
                        <div class="asset-info">
                            <span class="asset-title">toby</span>
                            <span class="asset-subtitle">$TOBY</span>
                        </div>
                        <div class="asset-balance" id="bal-toby">...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Ethers.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
