<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>TOBYWORLD Core Interface</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui-container">
        <div class="hud-panel top-left">
            <h3>TOBYWORLD // SYSTEM DIAGNOSTICS</h3>
            <p>> REACTOR CORE: <span class="status-ok">STABLE</span></p>
            <p>> LORELANDS SYNC: <span class="status-ok">100%</span></p>
            <p>> ENERGY OUTPUT: 9.84 TWh</p>
        </div>
        
        <div class="hud-panel top-right">
            <h3>LORELAND LEGEND</h3>
            <div id="loreland-list">
                <!-- Populated by JS -->
            </div>
        </div>



        <div class="hud-panel bottom-left" id="wallet-panel">
            <h3>TERMINAL ACCESS</h3>
            <button id="connect-wallet-btn" class="cyber-button">CONNECT WALLET</button>
            <div id="wallet-info" style="display: none;">
                <p>> STATUS: <span class="status-ok">AUTHENTICATED</span></p>
                <p>> NETWORK: <span id="network-status" class="status-ok">BASE</span></p>
                <p>> ID: <span id="wallet-address" style="color: #fff;">0x...</span></p>
                <div style="margin-top: 15px; border-top: 1px solid rgba(0,255,255,0.3); padding-top: 10px;">
                    <p>> $TOBY: <span id="bal-toby" style="color: #00ffff;">SYNCING...</span></p>
                    <p>> $TABOSHI: <span id="bal-taboshi" style="color: #00ffff;">SYNCING...</span></p>
                    <p>> $PATIENCE: <span id="bal-patience" style="color: #00ffff;">SYNCING...</span></p>
                </div>
            </div>
        </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Ethers.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
